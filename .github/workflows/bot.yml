
name: Faravahar Price Bot

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Get latest code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Run bot every 30 minutes
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
        run: |
          for i in {1..12}; do
            echo "Bot execution $i"
            python bot.py
            if [ "$i" -lt 12 ]; then
              sleep 1800
            fi
          done

      - name: Save previous prices
        if: always()
        run: |
          git config user.name "Faravahar Bot"
          git config user.email "bot@users.noreply.github.com"
          git add previous_prices.json
          git diff --cached --quiet || git commit -m "Update previous prices"
          git pull --rebase origin main
          git push origin main
